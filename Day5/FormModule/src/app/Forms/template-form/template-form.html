<div class="container">

  <h2>Template Driven Form</h2>

  <form #userForm="ngForm"
        (ngSubmit)="onSubmit()">

    <label>Name</label>

    <input
      type="text"
      name="name"
      [(ngModel)]="user.name"
      required
      minlength="3"
      #name="ngModel">

    <div *ngIf="name.invalid && name.touched">

      <small *ngIf="name.errors?.['required']">
        Name is required
      </small>

      <small *ngIf="name.errors?.['minlength']">
        Minimum 3 characters required
      </small>

    </div>

    <br><br>

    <label>Email</label>

    <input
      type="email"
      name="email"
      [(ngModel)]="user.email"
      required
      email
      #email="ngModel">

    <div *ngIf="email.invalid && email.touched">

      <small *ngIf="email.errors?.['required']">
        Email is required
      </small>

      <small *ngIf="email.errors?.['email']">
        Invalid Email
      </small>

    </div>

    <br><br>

    <label>Mobile</label>

    <input
      type="text"
      name="mobile"
      [(ngModel)]="user.mobile"
      required
      pattern="[0-9]{10}"
      #mobile="ngModel">

    <div *ngIf="mobile.invalid && mobile.touched">

      <small *ngIf="mobile.errors?.['required']">
        Mobile is required
      </small>

      <small *ngIf="mobile.errors?.['pattern']">
        Enter 10 digit mobile number
      </small>

    </div>

    <br><br>

    <button
      type="submit"
      [disabled]="userForm.invalid">

      Submit
    </button>

  </form>

</div>
