<div class = "filter-container">
    <span>filter:</span>
    <input type = "radio" name="filter" value = "all" [(ngModel)] = "selectFilter">
    <span>{{'All ('+all+')'}}</span>
    <input type = "radio" name="filter" value = "true" [(ngModel)] = "selectFilter">
    <span>{{'Available ('+available+')'}}</span>
    <input type = "radio" name="filter" value = "false" [(ngModel)] = "selectFilter">
    <span>{{'Full('+full+')'}}</span>
</div>
