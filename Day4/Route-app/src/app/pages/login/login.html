 <div class="login-card">

    <h1>Login</h1>

    <input
      type="email"
      placeholder="Enter Email"
      [(ngModel)]="email"
    />

    <input
      type="password"
      placeholder="Enter Password"
      [(ngModel)]="password"
    />

    <button (click)="login()">
      Login
    </button>

    <p>
      Don't have an account?

      <span (click)="goToSignup()">
        Signup
      </span>
    </p>

  </div>
