<div class="row" >
    <div class="col-7">
        <div class="card">
            <div class="card-header bg-warning">
                Photos List
            </div>
            <div class="card-body">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>SrNo</th>
                            <th>Title</th>
                            <th>Url</th>
                            <th>Thumbnail</th>  
                            
                        </tr>
                    </thead>
                    <tbody>
                        @for (item of photoList; track $index) {
                        <tr>
                            <td>{{$index +1}}</td>
                            <td>{{item.title}}</td>
                            <!-- <td>{{item.url}}</td> -->
                            <td>{{item.thumbnailUrl}}</td>
                            <td>
                                <button class = "btn sm bg-success" (click)="onEdit(item)">Edit</button>
                                <button class = "btn sm bg-danger">Delete</button>
                            </td>
                        </tr>
                    }
                    </tbody>
                </table>
            </div>
                
        </div>
    </div>
    <div class="col-5">
         <div class="card">
            <div class="card-header bg-warning">
                Photos List
            </div>
            <div class="card-body">
                <form>
                    <div class="row">
                        <div class="col-6">
                            <label>Album Id</label>
                            <input type="text" name="AlbumId" [(ngModel)]="newPhoto.albumId" class="form-control">
                            <label>Title</label>
                            <input type="text" name="title" [(ngModel)]="newPhoto.title" class="form-control">
                            <label>Url</label>
                            <input type="text" name="url" [(ngModel)]="newPhoto.url" class="form-control">
                            <label>Thumbnail</label>
                            <input type="text" name="thumbnailUrl" [(ngModel)]="newPhoto.thumbnailUrl" class="form-control">

                        </div>
                        <div class="row pt-2">
                            <div class="col-6">
                                <button class="btn btn-secondary">Reset</button>
                            </div>
                            <div class="col-6">
                                @if(newPhoto.id === 0){
                                    <button class="btn btn-success" (click)="onSaveButton()">Save</button>
                                }@else {
                                    <button class="btn btn-warning" (click)="onUpdateButton()">Update</button>

                                }
                                
                            </div>

                        </div>
                    </div>
                </form>
            </div>

    </div>
</div>
