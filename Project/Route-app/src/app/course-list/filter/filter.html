<div class = "filter-container">
    <span>filter:</span>
    <input type = "radio" name="filter" value = "all" [(ngModel)] = "selectFilter" (change)="onFilterChanged()">
    <span>{{'All ('+all+')'}}</span>
    <input type = "radio" name="filter" value = "available" [(ngModel)] = "selectFilter" (change)="onFilterChanged()">
    <span>{{'Available ('+available+')'}}</span>
    <input type = "radio" name="filter" value = "full" [(ngModel)] = "selectFilter" (change)="onFilterChanged()">
    <span>{{'Full('+full+')'}}</span>
</div>
